<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>页面不存在 · 体制内生存指南</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%232F5D50'/%3E%3Ctext x='32' y='45' font-size='36' text-anchor='middle' fill='%23FAF9F6' font-family='Songti SC,serif'%3E%E5%88%B6%3C/text%3E%3C/svg%3E">
<style>
:root{--bg:#FAF9F6;--ink:#1F2421;--muted:#6F7671;--line:#E4E0D8;--primary:#2F5D50;
--sans:-apple-system,"PingFang SC","Helvetica Neue",sans-serif;--serif:"Songti SC",Georgia,serif}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:var(--serif);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:40px 24px}
.box{max-width:480px;text-align:left}
.no{font-family:var(--sans);font-size:13px;letter-spacing:.3em;color:var(--primary);margin-bottom:16px}
h1{font-family:var(--sans);font-size:30px;font-weight:600;letter-spacing:-.02em;line-height:1.3;margin-bottom:16px}
p{font-size:16px;line-height:1.85;color:#3D4441;margin-bottom:12px}
a{display:inline-block;margin-top:20px;font-family:var(--sans);font-size:14px;color:#fff;background:var(--primary);padding:11px 22px;border-radius:6px;text-decoration:none}
a:hover{opacity:.9}
.tip{margin-top:26px;padding-top:18px;border-top:1px solid var(--line);font-size:13.5px;color:var(--muted)}
</style>
</head>
<body>
<div class="box">
  <p class="no">404</p>
  <h1>这一页不在账本里</h1>
  <p>你要找的页面不存在，可能是链接写错了，或者文件还没传上来。</p>
  <p>整本书都在首页，左侧有目录，可以直接跳到任意一节。</p>
  <a href="./">回到目录</a>
  <p class="tip">单位是拿钱的地方，不是卖命的地方。</p>
</div>
</body>
</html>
